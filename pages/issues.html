<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>問題區 — EcoPulse</title>
  <link rel="stylesheet" href="../css/base.css" />
  <style>
    /* ============================================
       Branch: feature/issues  (羅乃慈)
       File:   pages/issues.html
       ============================================ */
    body {
      background-image: url('https://images.unsplash.com/photo-1740471348165-2aac81fff608?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.05);
      z-index: 0;
      pointer-events: none;
    }
    .section, section {
      background: rgba(245, 242, 234, 0.88) !important;
    }

    /* --- Filter Bar --- */
    .filter-bar {
      display: flex;
      gap: var(--sp-sm);
      flex-wrap: wrap;
      margin-bottom: var(--sp-2xl);
    }

    .filter-btn {
      padding: 0.4rem 1rem;
      border-radius: var(--radius-xl);
      border: 2px solid var(--clr-border);
      background: var(--clr-surface);
      color: var(--clr-muted);
      font-size: 0.85rem;
      font-weight: 500;
      transition: all var(--t-fast);
      cursor: pointer;
      font-family: var(--ff-body);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--clr-primary);
      background: var(--clr-primary);
      color: #fff;
    }

    /* --- Flip Card Grid --- */
    .issues-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--sp-xl);
    }

    .flip-wrap {
      perspective: 1000px;
      height: 280px;
    }

    .flip-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .flip-wrap.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-front, .flip-back {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      padding: var(--sp-xl);
      border: 1px solid var(--clr-border);
      box-shadow: var(--shadow-sm);
    }

    .flip-front {
      background: var(--clr-surface);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .flip-back {
      background: var(--clr-primary);
      color: #fff;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .issue-icon {
      font-size: 2.8rem;
      margin-bottom: var(--sp-sm);
    }

    .issue-title {
      font-family: var(--ff-display);
      font-size: 1.3rem;
      color: var(--clr-dark);
      margin-bottom: var(--sp-sm);
    }

    .flip-back h3 {
      color: #fff;
      font-size: 1.05rem;
      margin-bottom: var(--sp-sm);
    }

    /* --- Video Carousel --- */
    .video-section {
      background: var(--clr-dark);
      padding: var(--sp-2xl) 0;
    }

    .video-section-title {
      text-align: center;
      color: #fff;
      margin-bottom: var(--sp-xl);
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
    }

    .video-section-title span {
      color: var(--clr-accent);
    }

    .video-carousel-wrap {
      position: relative;
      overflow: hidden;
      padding: 0 var(--sp-md);
    }

    .video-track {
      display: flex;
      align-items: center;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .video-item {
      flex-shrink: 0;
      width: 85%;
      margin: 0 3%;
      transition: opacity 0.5s, transform 0.5s;
      opacity: 0.3;
      transform: scale(0.88);
    }

    .video-item.active {
      opacity: 1;
      transform: scale(1);
    }

    .video-frame-wrap {
      position: relative;
      padding-bottom: 56.25%;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow-lg);
    }

    .video-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-label {
      text-align: center;
      color: var(--clr-muted);
      font-size: 0.85rem;
      margin-top: var(--sp-md);
    }

    .video-label strong {
      color: var(--clr-dark);
      font-size: 0.95rem;
    }

    /* Prev / Next buttons */
    .video-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1.4rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--t-fast);
      z-index: 10;
      border: none;
    }

    .video-nav-btn:hover { background: var(--clr-primary); }
    .video-nav-btn.prev { left: 4px; }
    .video-nav-btn.next { right: 4px; }
    .video-nav-btn:disabled { opacity: 0.3; cursor: default; }

    /* Dots */
    .video-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: var(--sp-lg);
    }

    .video-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.2);   /* 改這行 */
      cursor: pointer;
      transition: background var(--t-fast), transform var(--t-fast);
      border: none;
    }

    .video-dot.active {
      background: var(--clr-primary);  /* 改這行 */
      transform: scale(1.3);
    }

    /* --- Modal --- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: var(--sp-lg);
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--clr-surface);
      border-radius: var(--radius-xl);
      max-width: 560px;
      width: 100%;
      padding: var(--sp-2xl);
      position: relative;
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.3s ease;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: var(--sp-lg);
      right: var(--sp-lg);
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--clr-border);
      color: var(--clr-muted);
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--t-fast);
    }

    .modal-close:hover { background: var(--clr-primary); color: #fff; }

    .modal-icon { font-size: 2.5rem; margin-bottom: var(--sp-md); }
    .modal-box h2 { margin-bottom: var(--sp-sm); }
    .modal-box .stat-block {
      background: #F0F0E8;
      border-radius: var(--radius-md);
      padding: var(--sp-md);
      margin-bottom: var(--sp-lg);
      font-size: 0.9rem;
    }

    .modal-solutions h4 {
      font-family: var(--ff-body);
      font-weight: 600;
      color: var(--clr-primary);
      margin-bottom: var(--sp-sm);
      font-size: 0.9rem;
    }

    .modal-solutions ul { display: flex; flex-direction: column; gap: var(--sp-sm); }

    .modal-solutions li {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-sm);
      font-size: 0.9rem;
      color: var(--clr-text);
    }

    .modal-solutions li::before {
      content: '→';
      color: var(--clr-primary);
      font-weight: 700;
      flex-shrink: 0;
    }

    @keyframes floatMouse {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    @media (max-width: 768px) {
      .video-item { width: 80%; margin: 0 2%; }
    }

    @media (max-width: 600px) {
      .flip-wrap { height: 240px; }
      .issues-grid { grid-template-columns: 1fr; }
      .video-item { width: 90%; margin: 0 1%; }
    }
    @media (max-width: 768px) {
      .hero-grid { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <script src="../js/navbar.js"></script>

  <!-- Page hero -->
  <section class="section" style="background:linear-gradient(160deg,rgba(234,243,230,0.85) 0%,rgba(245,242,234,0.85) 70%);  padding-bottom:var(--sp-sm)">
  <div class="container">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2xl); align-items:flex-start">

      <div>

        <div id="videoCarouselWrap" style="position:relative; overflow: hidden; padding-right: 60px;">
          <div id="videoTrack" style="display:flex; align-items:center; transition:transform 0.5s cubic-bezier(0.4,0,0.2,1)"></div>

          <button class="video-nav-btn next" id="videoNext" style="top:40%">›</button>

</section>

  <!-- Main -->

    <div class="container">
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="consumption">消費</button>

  <script>
    Navbar.init('issues');

    /* ================================================
       VIDEO DATA
       ================================================ */
    const ALL_VIDEOS = [
      { ytId: '0aATDJ3x-Fw', category: '過度消費' },
      { ytId: '9-dpv2xbFyk', category: '塑膠污染' },
      { ytId: 'L8pEdHzQcik', category: '塑膠污染' },
      { ytId: 'zkASAZGIuu0', category: '食物浪費' },
      { ytId: '0R76cnBgrQs', category: '食物浪費' },
      { ytId: 'tLfNUD0-8ts', category: '快時尚衝擊' },
      { ytId: '00NIQgQE_d4', category: '快時尚衝擊' },
      { ytId: 'MQLadfsvfLo', category: '電子垃圾' },
      { ytId: '5k-PR4y_ng0', category: '電子垃圾' },
      { ytId: 'QsAgaD7IeuA', category: '能源浪費' },
    ];

    /* ================================================
       VIDEO CAROUSEL
       ================================================ */
    let currentVideo = 0;

    function buildCarousel() {
      const track = document.getElementById('videoTrack');
      const dots  = document.getElementById('videoDots');

      track.innerHTML = ALL_VIDEOS.map((v, i) => `
        <div class="video-item ${i === 0 ? 'active' : ''}" id="vItem${i}">
          <div class="video-frame-wrap">
            <iframe
              src="https://www.youtube.com/embed/${v.ytId}?rel=0"
              title="${v.category}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
          <div class="video-label">
            <strong>${v.category}</strong>
          </div>
        </div>
      `).join('');

      dots.innerHTML = ALL_VIDEOS.map((_, i) => `
        <button class="video-dot ${i === 0 ? 'active' : ''}" onclick="goToVideo(${i})"></button>
      `).join('');

      updateCarousel();
    }

    function updateCarousel() {
      const items    = document.querySelectorAll('.video-item');
      const dotBtns  = document.querySelectorAll('.video-dot');
      const track    = document.getElementById('videoTrack');
      const wrap     = document.getElementById('videoCarouselWrap');

      items.forEach((el, i) => {
        el.classList.toggle('active', i === currentVideo);
      });

      dotBtns.forEach((d, i) => d.classList.toggle('active', i === currentVideo));

      // Calculate offset: center the active item
      const itemW     = items[0].offsetWidth;
      const style     = window.getComputedStyle(items[0]);
      const marginL   = parseFloat(style.marginLeft);
      const marginR   = parseFloat(style.marginRight);
      const totalW    = itemW + marginL + marginR;
      const wrapW     = wrap.offsetWidth;
      const offset    = (wrapW / 2) - (currentVideo * totalW) - (itemW / 2);
      track.style.transform = `translateX(${offset}px)`;

      document.getElementById('videoPrev').disabled = currentVideo === 0;
      document.getElementById('videoNext').disabled = currentVideo === ALL_VIDEOS.length - 1;
    }

    function goToVideo(i) {
      currentVideo = i;
      updateCarousel();
    }

    document.getElementById('videoPrev').addEventListener('click', () => {
      if (currentVideo > 0) { currentVideo--; updateCarousel(); }
    });

    document.getElementById('videoNext').addEventListener('click', () => {
      if (currentVideo < ALL_VIDEOS.length - 1) { currentVideo++; updateCarousel(); }
    });

    window.addEventListener('resize', updateCarousel);

    /* ================================================
       RENDER CARDS
       ================================================ */
    function renderCards(filter = 'all') {
      const grid = document.getElementById('issuesGrid');
      const filtered = filter === 'all' ? ISSUES : ISSUES.filter(i => i.tag === filter);

      grid.innerHTML = filtered.map(issue => `
        <div class="flip-wrap" data-id="${issue.id}">
          <div class="flip-inner">
            <!-- Front -->
            <div class="flip-front">
              <div>
                <div class="issue-icon">${issue.icon}</div>
                <div class="issue-title">${issue.title}</div>
                <p style="font-size:0.87rem;color:var(--clr-muted);margin-bottom:var(--sp-md)">${issue.summary}</p>
              </div>
              <button
                onclick="openModal(${issue.id}, 'front'); event.stopPropagation();"
                class="btn btn-outline"
                style="margin-top:var(--sp-sm);width:100%;justify-content:center;font-size:0.82rem;height:44px"
              >深入了解 →</button>
            </div>
            <!-- Back -->
              <div class="flip-back">
                <div>
                  <div style="font-size:2.5rem; margin-bottom:var(--sp-sm)">${issue.backIcon}</div>
                  <div style="font-family:var(--ff-body); font-size:1.2rem; color:#fff; font-weight:700; margin-bottom:var(--sp-sm)">${issue.backTitle}</div>
                  <p style="font-size:0.87rem; color:rgba(255,255,255,0.85);margin-bottom:var(--sp-md)">${issue.backSummary}</p>
                </div>
                <button
                  onclick="openModal(${issue.id}, 'back'); event.stopPropagation();"
                  class="btn btn-outline"
                  style="background:#fff; color:var(--clr-primary); width:100%;justify-content:center;font-size:0.82rem;margin-top:var(--sp-lg);height:44px"
                >深入了解</button>
              </div>
            </div>
          </div>
      `  ).join('');

      grid.querySelectorAll('.flip-wrap').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          el.classList.toggle('flipped');
        });
      });
    }

    /* ================================================
       MODAL
       ================================================ */
    function openModal(id, side) {
      const issue = ISSUES.find(i => i.id === id);
      if (!issue) return;

      document.getElementById('mIcon').textContent = issue.icon;
      document.getElementById('mTitle').textContent = issue.title;

      const statBlock         = document.getElementById('mStat');
      const solutionBlock     = document.getElementById('solutionBlock');
      const effectsBlock      = document.getElementById('effectsBlock');
      const actionBlock       = document.getElementById('actionBlock');
      const causesBlock       = document.querySelector('#mCauses').closest('.modal-solutions');
      const consequencesBlock = document.querySelector('#mConsequences').closest('.modal-solutions');

      if (side === 'back') {
        statBlock.innerHTML        = `🎯 ${issue.action}`;
        statBlock.style.background = '#DFF0DF';
        causesBlock.style.display       = 'none';
        consequencesBlock.style.display = 'none';
        solutionBlock.style.display = 'block';
        effectsBlock.style.display  = 'block';
        actionBlock.style.display   = 'none';
        document.getElementById('mSolutions').innerHTML = issue.solutions.map(s => `<li>${s}</li>`).join('');
        document.getElementById('mEffects').innerHTML   = issue.effects.map(s => `<li>${s}</li>`).join('');
        
      } else {
        statBlock.innerHTML        = issue.stat;
        statBlock.style.background = '#F0F0E8';
        causesBlock.style.display       = 'block';
        consequencesBlock.style.display = 'block';
        document.getElementById('mCauses').innerHTML       = issue.causes.map(s => `<li>${s}</li>`).join('');
        document.getElementById('mConsequences').innerHTML = issue.consequences.map(s => `<li>${s}</li>`).join('');
        solutionBlock.style.display = 'none';
        effectsBlock.style.display  = 'none';
        actionBlock.style.display   = 'none';
      }

      document.getElementById('modal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modal') && !e.target.classList.contains('modal-close')) return;
      document.getElementById('modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    /* ================================================
       FILTER
       ================================================ */
    document.getElementById('filterBar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards(btn.dataset.filter);
    });

    // Init
    buildCarousel();
    renderCards();
  </script>
