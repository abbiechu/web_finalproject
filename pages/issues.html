<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>問題區 — EcoPulse</title>
  <link rel="stylesheet" href="../css/base.css" />
  <style>
    /* ============================================
       Branch: feature/issues  (羅乃慈)
       File:   pages/issues.html
       ============================================ */

    /* --- Filter Bar --- */
    .filter-bar {
      display: flex;
      gap: var(--sp-sm);
      flex-wrap: wrap;
      margin-bottom: var(--sp-2xl);
    }

    .filter-btn {
      padding: 0.4rem 1rem;
      border-radius: var(--radius-xl);
      border: 2px solid var(--clr-border);
      background: transparent;
      color: var(--clr-muted);
      font-size: 0.85rem;
      font-weight: 500;
      transition: all var(--t-fast);
      cursor: pointer;
      font-family: var(--ff-body);
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--clr-primary);
      background: var(--clr-primary);
      color: #fff;
    }

    /* --- Flip Card Grid --- */
    .issues-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--sp-xl);
    }

    /* Perspective wrapper */
    .flip-wrap {
      perspective: 1000px;
      height: 280px;
    }

    .flip-inner {
      position: relative;
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .flip-wrap.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    /* Card faces */
    .flip-front, .flip-back {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      padding: var(--sp-xl);
      border: 1px solid var(--clr-border);
      box-shadow: var(--shadow-sm);
    }

    .flip-front {
      background: var(--clr-surface);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .flip-back {
      background: var(--clr-primary);
      color: #fff;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Front content */
    .issue-icon {
      font-size: 2.8rem;
      margin-bottom: var(--sp-sm);
    }

    .issue-title {
      font-family: var(--ff-display);
      font-size: 1.3rem;
      color: var(--clr-dark);
      margin-bottom: var(--sp-sm);
    }

    /* Back content */
    .flip-back h3 {
      color: #fff;
      font-size: 1.05rem;
      margin-bottom: var(--sp-sm);
    }

    /* --- Modal --- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: var(--sp-lg);
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--clr-surface);
      border-radius: var(--radius-xl);
      max-width: 560px;
      width: 100%;
      padding: var(--sp-2xl);
      position: relative;
      box-shadow: var(--shadow-lg);
      animation: fadeUp 0.3s ease;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: var(--sp-lg);
      right: var(--sp-lg);
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--clr-border);
      color: var(--clr-muted);
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--t-fast);
    }

    .modal-close:hover { background: var(--clr-primary); color: #fff; }

    .modal-icon { font-size: 2.5rem; margin-bottom: var(--sp-md); }
    .modal-box h2 { margin-bottom: var(--sp-sm); }
    .modal-box .stat-block {
      background: #F0F0E8;
      border-radius: var(--radius-md);
      padding: var(--sp-md);
      margin-bottom: var(--sp-lg);
      font-size: 0.9rem;
    }

    .modal-solutions h4 {
      font-family: var(--ff-body);
      font-weight: 600;
      color: var(--clr-primary);
      margin-bottom: var(--sp-sm);
      font-size: 0.9rem;
    }

    .modal-solutions ul { display: flex; flex-direction: column; gap: var(--sp-sm); }

    .modal-solutions li {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-sm);
      font-size: 0.9rem;
      color: var(--clr-text);
    }

    .modal-solutions li::before {
      content: '→';
      color: var(--clr-primary);
      font-weight: 700;
      flex-shrink: 0;
    }

    @keyframes floatMouse {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .flip-wrap { height: 240px; }
      .issues-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

    /* ================================================
       RENDER CARDS
       ================================================ */

          <div class="flip-inner">

            <div class="flip-front">
              <div>

                <div class="issue-title">${issue.title}</div>
                <p style="font-size:0.87rem;color:var(--clr-muted);margin-bottom:var(--sp-md)">${issue.summary}</p>
              </div>
              <button
                onclick="openModal(${issue.id}, 'front'); event.stopPropagation();"
                class="btn btn-outline"
                style="margin-top:var(--sp-sm);width:100%;justify-content:center;font-size:0.82rem"
              >深入了解 →</button>
            </div>
            <!-- Back -->
            <div class="flip-back">
              <div>
                <h3>✅ 解決方案</h3>
                <p style="font-size:0.87rem;color:rgba(255,255,255,0.85);margin-top:var(--sp-sm)">
                  點擊深入了解，查看完整解決方案與預期改善成效。
                </p>
              </div>
              <button
                onclick="openModal(${issue.id}, 'back'); event.stopPropagation();"
                class="btn btn-accent"
                style="width:100%;justify-content:center;font-size:0.82rem"
              >深入了解 →</button>
            </div>
          </div>
        </div>
      `).join('');

      grid.querySelectorAll('.flip-wrap').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          el.classList.toggle('flipped');
        });
      });
    }

    /* ================================================
       MODAL
       ================================================ */
   function openModal(id, side) {
    const issue = ISSUES.find(i => i.id === id);
    if (!issue) return;

    document.getElementById('mIcon').textContent = issue.icon;
    document.getElementById('mTitle').textContent = issue.title;

    const solutionBlock = document.getElementById('solutionBlock');
    const effectsBlock  = document.getElementById('effectsBlock');
    const actionBlock   = document.getElementById('actionBlock');
    const statBlock     = document.getElementById('mStat');
    const causesBlock   = document.querySelector('#mCauses').closest('.modal-solutions');
    const consequencesBlock = document.querySelector('#mConsequences').closest('.modal-solutions');

    if (side === 'back') {
      // 頂部顯示本週行動，隱藏統計數字
      statBlock.innerHTML = `🎯 ${issue.action}`;
      statBlock.style.background = '#DFF0DF';

      // 隱藏造成原因與後果
      causesBlock.style.display      = 'none';
      consequencesBlock.style.display = 'none';

      // 顯示解決方案、成效、行動
      solutionBlock.style.display = 'block';
      effectsBlock.style.display  = 'block';
      actionBlock.style.display   = 'none';

      document.getElementById('mSolutions').innerHTML = issue.solutions.map(s => `<li>${s}</li>`).join('');
      document.getElementById('mEffects').innerHTML   = issue.effects.map(s => `<li>${s}</li>`).join('');
    } else {
      // 正面：顯示統計數字、原因、後果
      statBlock.innerHTML = issue.stat;
      statBlock.style.background = '#F0F0E8';

      causesBlock.style.display      = 'block';
      consequencesBlock.style.display = 'block';

      document.getElementById('mCauses').innerHTML       = issue.causes.map(s => `<li>${s}</li>`).join('');
      document.getElementById('mConsequences').innerHTML = issue.consequences.map(s => `<li>${s}</li>`).join('');

      solutionBlock.style.display = 'none';
      effectsBlock.style.display  = 'none';
      actionBlock.style.display   = 'none';
    }

    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

    function closeModal(e) {
      if (e && e.target !== document.getElementById('modal') && !e.target.classList.contains('modal-close')) return;
      document.getElementById('modal').classList.remove('open');
      document.body.style.overflow = '';
    }

    /* ================================================
       FILTER
       ================================================ */
    document.getElementById('filterBar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards(btn.dataset.filter);
    });

    // Init
    renderCards();
  </script>
</body>
</html>
