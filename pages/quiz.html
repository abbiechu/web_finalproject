<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>環保測驗 — EcoPulse</title>
  <link rel="stylesheet" href="../css/base.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ============================================
       環保測驗 - 分頁式設計
       每頁 5 題，按主題分類
       包含完整響應式設計
       ============================================ */

    /* ===== 基礎樣式 ===== */
    #introPanel {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-2xl);
      align-items: center;
    }

    .intro-badges {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-sm);
      margin: var(--sp-lg) 0;
    }

    .category-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--clr-border);
      background: var(--clr-surface);
      font-size: 0.83rem;
      font-weight: 500;
    }

    .tier-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-md);
    }

    .tier-item {
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      padding: var(--sp-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--clr-border);
      background: var(--clr-surface);
    }

    .tier-icon {
      font-size: 1.5rem;
      width: 40px;
      text-align: center;
    }

    .tier-item strong {
      display: block;
      font-size: 0.9rem;
    }

    .tier-item span {
      font-size: 0.8rem;
      color: var(--clr-muted);
    }

    /* ===== 測驗頁面 ===== */
    #quizPanel {
      display: none;
      min-height: calc(100vh - var(--nav-h));
      padding: var(--sp-2xl) 0;
    }

    #quizPanel.active {
      display: block;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--sp-2xl);
      padding-bottom: var(--sp-lg);
      border-bottom: 2px solid var(--clr-border);
    }

    .quiz-header h2 {
      font-size: 1.5rem;
      color: var(--clr-dark);
      display: flex;
      align-items: center;
      gap: var(--sp-md);
    }

    .quiz-header-icon {
      font-size: 2rem;
    }

    .quiz-progress {
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      font-size: 0.9rem;
      color: var(--clr-muted);
    }

    .progress-bar-container {
      width: 200px;
      height: 6px;
      background: var(--clr-border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--clr-primary), var(--clr-primary-lt));
      transition: width 0.5s ease;
    }

    /* 題目卡片 */
    .questions-container {
      display: flex;
      flex-direction: column;
      gap: var(--sp-xl);
      margin-bottom: var(--sp-2xl);
    }

    .question-item {
      background: var(--clr-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--clr-border);
      padding: var(--sp-xl);
      transition: all var(--t-normal);
    }

    .question-item:hover {
      border-color: var(--clr-primary);
      box-shadow: 0 4px 12px rgba(58, 107, 58, 0.1);
    }

    .question-number {
      display: inline-block;
      width: 32px;
      height: 32px;
      background: var(--clr-primary);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: var(--sp-md);
    }

    .question-text {
      font-family: var(--ff-display);
      font-size: 1.1rem;
      color: var(--clr-dark);
      margin-bottom: var(--sp-lg);
      line-height: 1.5;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-md);
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      padding: var(--sp-md) var(--sp-lg);
      border-radius: var(--radius-md);
      border: 2px solid var(--clr-border);
      background: var(--clr-surface);
      text-align: left;
      cursor: pointer;
      transition: all var(--t-fast);
      font-family: var(--ff-body);
      font-size: 0.95rem;
      color: var(--clr-text);
      width: 100%;
    }

    .option-btn:hover {
      border-color: var(--clr-primary);
      background: #EAF3E6;
      transform: translateX(4px);
    }

    .option-btn.selected {
      border-color: var(--clr-primary);
      background: #EAF3E6;
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--clr-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: all var(--t-fast);
    }

    .option-btn.selected .option-letter,
    .option-btn:hover .option-letter {
      background: var(--clr-primary);
      color: #fff;
    }

    /* 導航按鈕 */
    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--sp-lg);
      margin-top: var(--sp-2xl);
    }

    .btn {
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--t-fast);
      font-family: var(--ff-body);
    }

    .btn-primary {
      background: var(--clr-primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--clr-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(58, 107, 58, 0.3);
    }

    .btn-secondary {
      background: var(--clr-border);
      color: var(--clr-text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--clr-muted);
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quiz-page-info {
      text-align: center;
      font-size: 0.9rem;
      color: var(--clr-muted);
    }

    /* ===== 結果頁面 ===== */
    #resultPanel {
      display: none;
      min-height: calc(100vh - var(--nav-h));
      padding: var(--sp-2xl) 0;
    }

    #resultPanel.active {
      display: block;
    }

    .result-header {
      text-align: center;
      padding: var(--sp-3xl) 0 var(--sp-2xl);
    }

    .tier-badge-large {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-sm);
      padding: var(--sp-xl) var(--sp-2xl);
      border-radius: var(--radius-xl);
      margin-bottom: var(--sp-lg);
      color: #fff;
    }

    .tier-badge-large .tier-emoji {
      font-size: 3.5rem;
    }

    .tier-badge-large .tier-name {
      font-family: var(--ff-display);
      font-size: 1.8rem;
    }

    .tier-badge-large .tier-score {
      font-size: 1rem;
      opacity: 0.85;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-xl);
      align-items: start;
      margin-top: var(--sp-2xl);
      margin-bottom: var(--sp-2xl);
    }

    .radar-wrap {
      background: var(--clr-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--clr-border);
      padding: var(--sp-xl);
    }

    .radar-wrap h3 {
      font-size: 1rem;
      margin-bottom: var(--sp-md);
      text-align: center;
    }

    .diagnosis-card {
      background: var(--clr-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--clr-border);
      padding: var(--sp-xl);
    }

    .diagnosis-card h3 {
      font-size: 1rem;
      margin-bottom: var(--sp-lg);
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
    }

    .diagnosis-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--clr-text);
    }

    .diagnosis-content p {
      margin-bottom: var(--sp-md);
    }

    .diagnosis-content strong {
      color: var(--clr-primary);
    }

    .breakdown-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-md);
      margin-top: var(--sp-xl);
    }

    .breakdown-card {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      padding: var(--sp-lg);
      text-align: center;
    }

    .breakdown-score {
      font-family: var(--ff-display);
      font-size: 2rem;
      font-weight: 900;
      color: var(--clr-primary);
    }

    .breakdown-label {
      font-size: 0.8rem;
      color: var(--clr-muted);
      margin-top: 4px;
    }

    /* ===== 響應式設計 ===== */
    @media (max-width: 1024px) {
      .intro-grid {
        grid-template-columns: 1fr;
      }

      .intro-badges {
        flex-wrap: wrap;
      }

      .category-badge {
        font-size: 0.8rem;
        padding: 0.35rem 0.8rem;
      }

      .tier-list {
        gap: var(--sp-md);
      }

      .tier-item {
        padding: var(--sp-md);
      }

      .tier-icon {
        font-size: 1.3rem;
        width: 35px;
      }

      .tier-item strong {
        font-size: 0.85rem;
      }

      .tier-item span {
        font-size: 0.75rem;
      }

      .quiz-header h2 {
        font-size: 1.3rem;
      }

      .quiz-header-icon {
        font-size: 1.8rem;
      }

      .question-item {
        padding: var(--sp-lg);
      }

      .question-text {
        font-size: 1rem;
      }

      .option-btn {
        padding: var(--sp-md) var(--sp-lg);
        font-size: 0.9rem;
      }

      .result-grid {
        grid-template-columns: 1fr;
      }

      .breakdown-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 768px) {
      .intro-grid {
        grid-template-columns: 1fr;
      }

      .intro-badges {
        gap: var(--sp-sm);
      }

      .category-badge {
        font-size: 0.75rem;
        padding: 0.3rem 0.7rem;
      }

      .tier-list {
        gap: var(--sp-sm);
      }

      .tier-item {
        padding: var(--sp-md);
        gap: var(--sp-sm);
      }

      .tier-icon {
        font-size: 1.2rem;
        width: 32px;
      }

      .tier-item strong {
        font-size: 0.8rem;
      }

      .tier-item span {
        font-size: 0.7rem;
      }

      #quizPanel {
        padding: var(--sp-lg) 0;
      }

      .quiz-header {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--sp-md);
        margin-bottom: var(--sp-lg);
      }

      .quiz-header h2 {
        font-size: 1.2rem;
      }

      .quiz-header-icon {
        font-size: 1.6rem;
      }

      .quiz-progress {
        width: 100%;
        justify-content: space-between;
      }

      .progress-bar-container {
        width: 100%;
      }

      .question-item {
        padding: var(--sp-lg);
      }

      .question-text {
        font-size: 1rem;
        margin-bottom: var(--sp-md);
      }

      .option-btn {
        padding: var(--sp-md);
        font-size: 0.9rem;
      }

      .quiz-nav {
        gap: var(--sp-md);
      }

      .btn {
        padding: 0.7rem 1.2rem;
        font-size: 0.9rem;
      }

      .result-grid {
        grid-template-columns: 1fr;
        gap: var(--sp-lg);
        margin-bottom: var(--sp-lg);
      }

      .breakdown-grid {
        grid-template-columns: 1fr;
      }

      .tier-badge-large .tier-emoji {
        font-size: 3rem;
      }

      .tier-badge-large .tier-name {
        font-size: 1.5rem;
      }

      .diagnosis-content {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .intro-badges {
        gap: var(--sp-xs);
      }

      .category-badge {
        font-size: 0.7rem;
        padding: 0.25rem 0.6rem;
      }

      .tier-list {
        gap: var(--sp-xs);
      }

      .tier-item {
        padding: var(--sp-sm);
        gap: var(--sp-xs);
      }

      .tier-icon {
        font-size: 1rem;
        width: 28px;
      }

      .tier-item strong {
        font-size: 0.75rem;
      }

      .tier-item span {
        font-size: 0.65rem;
      }

      #quizPanel {
        padding: var(--sp-md) 0;
      }

      .quiz-header {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--sp-sm);
        margin-bottom: var(--sp-lg);
        padding-bottom: var(--sp-md);
      }

      .quiz-header h2 {
        font-size: 1.1rem;
      }

      .quiz-header-icon {
        font-size: 1.4rem;
      }

      .quiz-progress {
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--sp-xs);
        font-size: 0.8rem;
      }

      .progress-bar-container {
        width: 100%;
        height: 4px;
      }

      .question-number {
        width: 28px;
        height: 28px;
        font-size: 0.8rem;
      }

      .question-item {
        padding: var(--sp-md);
        margin-bottom: var(--sp-md);
      }

      .question-text {
        font-size: 0.95rem;
        margin-bottom: var(--sp-md);
      }

      .options-list {
        gap: var(--sp-sm);
      }

      .option-btn {
        padding: var(--sp-sm) var(--sp-md);
        font-size: 0.85rem;
      }

      .option-letter {
        width: 24px;
        height: 24px;
        font-size: 0.75rem;
      }

      .quiz-nav {
        flex-direction: column;
        gap: var(--sp-sm);
      }

      .btn {
        width: 100%;
        padding: 0.6rem 1rem;
        font-size: 0.85rem;
      }

      .quiz-page-info {
        font-size: 0.8rem;
      }

      .result-grid {
        gap: var(--sp-lg);
      }

      .breakdown-grid {
        grid-template-columns: 1fr;
        gap: var(--sp-sm);
        margin-bottom: var(--sp-xl);
      }

      .breakdown-card {
        padding: var(--sp-md);
      }

      .breakdown-score {
        font-size: 1.5rem;
      }

      .breakdown-label {
        font-size: 0.7rem;
      }

      .tier-badge-large {
        padding: var(--sp-lg) var(--sp-md);
      }

      .tier-badge-large .tier-emoji {
        font-size: 2.5rem;
      }

      .tier-badge-large .tier-name {
        font-size: 1.2rem;
      }

      .tier-badge-large .tier-score {
        font-size: 0.9rem;
      }

      .radar-wrap,
      .diagnosis-card {
        padding: var(--sp-lg);
      }

      .radar-wrap h3,
      .diagnosis-card h3 {
        font-size: 0.95rem;
      }

      .diagnosis-content {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <script src="../js/navbar.js"></script>

  <!-- ===== 介紹頁面 ===== -->
  <section class="section" id="introPanel">
    <div class="container">
      <div class="intro-grid">
        <div>
          <span class="badge badge-green" style="margin-bottom: var(--sp-md)">環保測驗</span>
          <h1>測測你的<br/>環保指數</h1>
          <p style="color: var(--clr-muted); margin: var(--sp-md) 0; font-size: 1.05rem">
            針對「責任消費與生產 SDG 12」設計的 20 題互動測驗。<br/>
            每個主題 5 題，完成後獲得你的環保雷達圖與深度個人化建議。
          </p>

          <div class="intro-badges">
            <span class="category-badge">🥗 綠色飲食 × 5</span>
            <span class="category-badge">🛍️ 明智購物 × 5</span>
            <span class="category-badge">♻️ 物品再生 × 5</span>
            <span class="category-badge">⚡ 節能減碳 × 5</span>
          </div>

          <button class="btn btn-primary" onclick="startQuiz()" style="font-size: 1rem; padding: 0.9rem 2rem">
            🚀 開始測驗
          </button>
        </div>

        <div class="tier-list">
          <div class="tier-item">
            <div class="tier-icon">🏆</div>
            <div>
              <strong>90+　金色永續守護者</strong>
              <span>引領永續生活的標竿</span>
            </div>
          </div>
          <div class="tier-item">
            <div class="tier-icon">🥈</div>
            <div>
              <strong>70–89　銀色綠色實踐家</strong>
              <span>持續踐行永續理念</span>
            </div>
          </div>
          <div class="tier-item">
            <div class="tier-icon">🥉</div>
            <div>
              <strong>50–69　銅色環保新手</strong>
              <span>開始認識永續生活</span>
            </div>
          </div>
          <div class="tier-item">
            <div class="tier-icon">🌱</div>
            <div>
              <strong>< 50　綠芽探索者</strong>
              <span>永續旅程的起點</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 測驗頁面 ===== -->
  <section class="section" id="quizPanel">
    <div class="container">
      <div class="quiz-header">
        <h2>
          <span class="quiz-header-icon" id="categoryIcon">🥗</span>
          <span id="categoryTitle">綠色飲食</span>
        </h2>
        <div class="quiz-progress">
          <span id="pageInfo">第 1 / 4 主題</span>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressFill" style="width: 25%"></div>
          </div>
        </div>
      </div>

      <div class="questions-container" id="questionsContainer"></div>

      <div class="quiz-nav">
        <button class="btn btn-secondary" onclick="previousPage()" id="prevBtn" disabled>
          ← 上一頁
        </button>
        <div class="quiz-page-info">
          <span id="currentPage">第 1 / 4 頁</span>
        </div>
        <button class="btn btn-primary" onclick="nextPage()" id="nextBtn">
          下一頁 →
        </button>
      </div>
    </div>
  </section>

  <!-- ===== 結果頁面 ===== -->
  <section class="section" id="resultPanel">
    <div class="container">
      <div class="result-header">
        <div class="tier-badge-large" id="tierBadge">
          <div class="tier-emoji" id="tierEmoji">🏆</div>
          <div class="tier-name" id="tierName">金色永續守護者</div>
          <div class="tier-score" id="tierScore">90 分</div>
        </div>
      </div>

      <div class="result-grid">
        <div class="radar-wrap">
          <h3>環保指數雷達圖</h3>
          <canvas id="radarChart"></canvas>
        </div>

        <div class="diagnosis-card">
          <h3>🎯 個人化建議</h3>
          <div class="diagnosis-content" id="diagnosisContent"></div>
        </div>
      </div>

      <div class="breakdown-grid" id="breakdownGrid"></div>

      <div style="text-align: center; margin-top: var(--sp-2xl)">
        <button class="btn btn-primary" onclick="resetQuiz()" style="font-size: 1rem; padding: 0.9rem 2rem">
          🔄 重新測驗
        </button>
      </div>
    </div>
  </section>

  <script>
    // ============================================
    // 測驗資料結構
    // ============================================

    const QUIZ_DATA = {
      categories: [
        {
          id: 'diet',
          name: '綠色飲食',
          icon: '🥗',
          color: '#3a6b3a'
        },
        {
          id: 'shopping',
          name: '明智購物',
          icon: '🛍️',
          color: '#5a8a5a'
        },
        {
          id: 'reuse',
          name: '物品再生',
          icon: '♻️',
          color: '#7aa97a'
        },
        {
          id: 'energy',
          name: '節能減碳',
          icon: '⚡',
          color: '#9ac89a'
        }
      ],
      questions: [
        // 綠色飲食 (0-4)
        {
          category: 'diet',
          text: '您多久吃一次肉類食品？',
          options: [
            { text: '每天都吃', score: 0 },
            { text: '一週 3-4 次', score: 25 },
            { text: '一週 1-2 次', score: 50 },
            { text: '很少吃或不吃', score: 100 }
          ]
        },
        {
          category: 'diet',
          text: '您購買食材時是否考慮在地、當季產品？',
          options: [
            { text: '從不考慮', score: 0 },
            { text: '偶爾考慮', score: 33 },
            { text: '經常考慮', score: 66 },
            { text: '總是優先選擇', score: 100 }

    // 狀態管理
    let quizAnswers = {};
    let currentPage = 1;
    const QUESTIONS_PER_PAGE = 5;

    // ============================================
    // 初始化與導航
    // ============================================

    function startQuiz() {
      quizAnswers = {};
      currentPage = 1;
      document.getElementById('introPanel').classList.remove('active');
      document.getElementById('quizPanel').classList.add('active');
      renderQuestions();
      updateProgressBar();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      const startIdx = (currentPage - 1) * QUESTIONS_PER_PAGE;
      const endIdx = Math.min(startIdx + QUESTIONS_PER_PAGE, QUIZ_DATA.questions.length);
      const pageCategoryId = QUIZ_DATA.questions[startIdx].category;
      const pageCategory = QUIZ_DATA.categories.find(c => c.id === pageCategoryId);

      // 更新標題
      document.getElementById('categoryIcon').textContent = pageCategory.icon;
      document.getElementById('categoryTitle').textContent = pageCategory.name;
      document.getElementById('pageInfo').textContent = `第 ${currentPage} / 4 主題`;

      // 遍歷該頁的所有問題
      for (let i = startIdx; i < endIdx; i++) {
        const question = QUIZ_DATA.questions[i];
        const questionNum = i + 1;

        const questionHTML = `
          <div class="question-item">
            <div class="question-number">${questionNum}</div>
            <div class="question-text">${question.text}</div>
            <div class="options-list">
              ${question.options.map((option, idx) => `
                <button class="option-btn" onclick="selectAnswer(${i}, ${idx})">
                  <span class="option-letter">${String.fromCharCode(65 + idx)}</span>
                  <span>${option.text}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
        container.innerHTML += questionHTML;
      }

      // 高亮已選擇的答案
      Object.keys(quizAnswers).forEach(qIdx => {
        const selectedBtn = document.querySelectorAll('.option-btn')[
          parseInt(qIdx) * 4 + quizAnswers[qIdx]
        ];
        if (selectedBtn) selectedBtn.classList.add('selected');
      });

      updateButtons();
      document.getElementById('currentPage').textContent = `第 ${currentPage} / 4 頁`;
    }

    function selectAnswer(questionIdx, optionIdx) {
      quizAnswers[questionIdx] = optionIdx;
      renderQuestions();
    }

    function nextPage() {
      if (currentPage < 4) {
        currentPage++;
        renderQuestions();
        updateProgressBar();
        window.scrollTo(0, 0);
      } else {
        showResult();
      }
    }

    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        renderQuestions();
        updateProgressBar();
        window.scrollTo(0, 0);
      }
    }

    function updateButtons() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const nextBtnLabel = document.getElementById('nextBtn').textContent;

      prevBtn.disabled = currentPage === 1;
      nextBtn.textContent = currentPage === 4 ? '完成 ✓' : '下一頁 →';
    }

    function updateProgressBar() {
      const percentage = (currentPage / 4) * 100;
      document.getElementById('progressFill').style.width = percentage + '%';
    }

    // ============================================
    // 計分與結果
    // ============================================

    function calculateScores() {
      const categoryScores = {};
      
      // 初始化各類別分數
      QUIZ_DATA.categories.forEach(cat => {
        categoryScores[cat.id] = { total: 0, count: 0, percentage: 0 };
      });

      // 計算每個類別的分數
      QUIZ_DATA.questions.forEach((question, idx) => {
        if (quizAnswers.hasOwnProperty(idx)) {
          const selectedOptionIdx = quizAnswers[idx];
          const score = question.options[selectedOptionIdx].score;
          categoryScores[question.category].total += score;
          categoryScores[question.category].count += 1;
        }
      });

      // 計算百分比
      Object.keys(categoryScores).forEach(catId => {
        const data = categoryScores[catId];
        if (data.count > 0) {
          data.percentage = Math.round(data.total / data.count);
        }
      });

      // 計算總分（100分制）
      let totalScore = 0;
      let totalQuestions = 0;
      Object.keys(categoryScores).forEach(catId => {
        totalScore += categoryScores[catId].total;
        totalQuestions += categoryScores[catId].count;
      });
      const overallScore = Math.round((totalScore / (totalQuestions * 100)) * 100);

      return { categoryScores, overallScore };
    }

    function getTierInfo(score) {
      if (score >= 90) {
        return { emoji: '🏆', name: '金色永續守護者', color: '#FFD700', level: 'high' };
      } else if (score >= 70) {
        return { emoji: '🥈', name: '銀色綠色實踐家', color: '#C0C0C0', level: 'high' };
      } else if (score >= 50) {
        return { emoji: '🥉', name: '銅色環保新手', color: '#CD7F32', level: 'medium' };
      } else {
        return { emoji: '🌱', name: '綠芽探索者', color: '#7CB342', level: 'low' };
      }
    }

    function showResult() {
      document.getElementById('quizPanel').classList.remove('active');
      document.getElementById('resultPanel').classList.add('active');

      const { categoryScores, overallScore } = calculateScores();
      const tierInfo = getTierInfo(overallScore);

      // 更新分級徽章
      document.getElementById('tierEmoji').textContent = tierInfo.emoji;
      document.getElementById('tierName').textContent = tierInfo.name;
      document.getElementById('tierScore').textContent = `${overallScore} 分`;
      document.getElementById('tierBadge').style.backgroundColor = tierInfo.color;

      // 生成雷達圖
      generateRadarChart(categoryScores);

      // 生成個人化建議
      generateDiagnosis(categoryScores, tierInfo);

    }

    function generateRadarChart(categoryScores) {
      const ctx = document.getElementById('radarChart').getContext('2d');
      const labels = QUIZ_DATA.categories.map(c => c.name);
      const data = QUIZ_DATA.categories.map(c => categoryScores[c.id].percentage);
      const colors = QUIZ_DATA.categories.map(c => c.color);

      if (window.radarChartInstance) {
        window.radarChartInstance.destroy();
      }

      window.radarChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [{
            label: '您的環保指數',
            data: data,
            borderColor: '#3a6b3a',
            backgroundColor: 'rgba(58, 107, 58, 0.1)',
            borderWidth: 2,
            pointRadius: 5,
            pointHoverRadius: 7,
            pointBackgroundColor: '#3a6b3a',
            pointBorderColor: '#fff',
            pointBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          scales: {
            r: {
              beginAtZero: true,
              max: 100,
              ticks: {
                stepSize: 20,
                font: { size: 12 }
              }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    function generateDiagnosis(categoryScores, tierInfo) {
      const diagnosisContent = document.getElementById('diagnosisContent');
      let html = '';

      // 添加總體評語
      const overallScore = Math.round(
        Object.values(categoryScores).reduce((sum, cat) => sum + cat.percentage, 0) / 4
      );
      
      QUIZ_DATA.categories.forEach(category => {
        const catScore = categoryScores[category.id].percentage;
        const advice = QUIZ_DATA.diagnosis[category.id].advice;
        
        let adviceText;
        if (catScore >= 70) {
          adviceText = advice.high;
        } else if (catScore >= 50) {
          adviceText = advice.medium;
        } else {
          adviceText = advice.low;
        }

        html += `
          <div style="margin-bottom: 1.5rem;">
            <h4 style="color: var(--clr-primary); margin-bottom: 0.5rem; font-size: 0.95rem;">
              ${category.icon} ${category.name}（${catScore} 分）
            </h4>
            ${adviceText}
          </div>
        `;
      });

      diagnosisContent.innerHTML = html;
    }

    function generateBreakdownCards(categoryScores) {
      const breakdownGrid = document.getElementById('breakdownGrid');
      breakdownGrid.innerHTML = '';

      QUIZ_DATA.categories.forEach(category => {
        const score = categoryScores[category.id].percentage;
        const card = document.createElement('div');
        card.className = 'breakdown-card';
        card.innerHTML = `
          <div style="font-size: 1.5rem; margin-bottom: 0.5rem;">${category.icon}</div>
          <div class="breakdown-score">${score}</div>
          <div class="breakdown-label">${category.name}</div>
        `;
        breakdownGrid.appendChild(card);
      });
    }

    function resetQuiz() {
      document.getElementById('resultPanel').classList.remove('active');
      document.getElementById('introPanel').classList.add('active');
      quizAnswers = {};
      currentPage = 1;
      window.scrollTo(0, 0);
    }

    // 頁面加載時初始化
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('introPanel').classList.add('active');
    });
  </script>
</body>
</html>
