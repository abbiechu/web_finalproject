<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>選擇測驗身份 — EcoPulse</title>
  <link rel="stylesheet" href="../css/base.css" />
  <style>
    body {
      background-image: url('https://images.unsplash.com/photo-1740471348165-2aac81fff608?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.10);
      z-index: 0;
      pointer-events: none;
    }

    /* ── Section：普通區塊，不做 flex，跟 issues.html 一樣 ── */
    .select-section {
      position: relative;
      z-index: 1;
      background: rgba(245, 242, 234, 0.88);
      min-height: calc(100vh - var(--nav-h));
      padding: var(--sp-3xl) 0;
    }

    /* ── 置中邏輯放在內層 div ── */
    .select-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--nav-h) - var(--sp-3xl) * 2);
    }

    .select-eyebrow {
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--clr-primary-lt);
      margin-bottom: var(--sp-lg);
    }
    .select-eyebrow-dot {
      width: 7px; height: 7px;
      background: var(--clr-primary-lt);
      border-radius: 50%;
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    .select-heading {
      text-align: center;
      margin-bottom: var(--sp-sm);
    }
    .select-heading em {
      font-style: italic;
      color: var(--clr-primary);
    }

    .select-sub {
      text-align: center;
      color: var(--clr-muted);
      font-size: 1rem;
      max-width: 460px;
      margin: 0 auto var(--sp-2xl);
      line-height: 1.75;
    }

    .select-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-xl);
      width: 100%;
      max-width: 680px;
    }

    .select-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: var(--sp-md);
      text-decoration: none;
      color: var(--clr-text);
    }
    .select-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .select-card--consumer::before {
      background: linear-gradient(90deg, var(--clr-primary), var(--clr-primary-lt));
    }
    .select-card--producer::before {
      background: linear-gradient(90deg, var(--clr-accent), #b8860b);
    }

    .select-card-deco {
      position: absolute;
      width: 140px; height: 140px;
      border-radius: 50%;
      opacity: 0.07;
      bottom: -40px; right: -30px;
      pointer-events: none;
    }
    .select-card--consumer .select-card-deco { background: var(--clr-primary); }
    .select-card--producer .select-card-deco { background: var(--clr-accent); }

    .select-card-icon {
      width: 48px; height: 48px;
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .select-card--consumer .select-card-icon { background: #DFF0DF; }
    .select-card--producer .select-card-icon { background: #FFF3CD; }

    .select-card-tag {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .select-card--consumer .select-card-tag { color: var(--clr-primary); }
    .select-card--producer .select-card-tag { color: #8a6700; }

    .select-card-title {
      font-family: var(--ff-display);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--clr-dark);
      line-height: 1.2;
    }

    .select-card-desc {
      font-size: 0.88rem;
      color: var(--clr-muted);
      line-height: 1.7;
    }

    .select-card-cta {
      margin-top: var(--sp-sm);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-xl);
      font-size: 0.85rem;
      font-weight: 600;
      border: 2px solid;
      transition: background var(--t-fast), color var(--t-fast);
      width: fit-content;
    }
    .select-card--consumer .select-card-cta {
      color: var(--clr-primary);
      border-color: var(--clr-primary);
      background: transparent;
    }
    .select-card--consumer:hover .select-card-cta {
      background: var(--clr-primary);
      color: #fff;
    }
    .select-card--producer .select-card-cta {
      color: #8a6700;
      border-color: var(--clr-accent);
      background: transparent;
    }
    .select-card--producer:hover .select-card-cta {
      background: var(--clr-accent);
      color: var(--clr-dark);
    }
    .cta-arrow { transition: transform var(--t-fast); }
    .select-card:hover .cta-arrow { transform: translateX(4px); }

    .select-footer {
      position: relative;
      z-index: 1;
      background: var(--clr-dark);
      color: rgba(255,255,255,0.6);
      padding: var(--sp-xl) 0;
      text-align: center;
      font-size: 0.85rem;
    }

    .select-eyebrow  { animation: fadeUp 0.5s ease both; }
    .select-heading  { animation: fadeUp 0.5s 0.08s ease both; }
    .select-sub      { animation: fadeUp 0.5s 0.15s ease both; }
    .select-card:nth-child(1) { animation: fadeUp 0.55s 0.22s ease both; }
    .select-card:nth-child(2) { animation: fadeUp 0.55s 0.32s ease both; }

    @media (max-width: 600px) {
      .select-cards { grid-template-columns: 1fr; max-width: 100%; }
    }
  </style>
</head>
<body>

  <section class="select-section">
    <div class="container">
      <div class="select-inner">

        <div class="select-eyebrow">
          <span class="select-eyebrow-dot"></span>
          開始之前
        </div>

        <h1 class="select-heading">
          您的角色是？<br><em>選擇您的身份</em>
        </h1>

        <p class="select-sub">
          根據您的身份，我們將為您提供最合適的環境知識測驗
        </p>

        <div class="select-cards">

          <a href="quiz.html" class="card select-card select-card--consumer">
            <div class="select-card-deco"></div>
            <div class="select-card-icon">🛍️</div>
            <span class="select-card-tag">消費者</span>
            <h2 class="select-card-title">我是消費者</h2>
            <p class="select-card-desc">
              了解日常生活中的飲食、購物、回收和用電習慣，算出你的真實環保指數。
            </p>
            <span class="select-card-cta">
              開始測驗
              <svg class="cta-arrow" width="14" height="14" viewBox="0 0 16 16" fill="none"
                   stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8h10M9 4l4 4-4 4"/>
              </svg>
            </span>
          </a>

          <a href="quiz_producer.html" class="card select-card select-card--producer">
            <div class="select-card-deco"></div>
            <div class="select-card-icon">🏭</div>
            <span class="select-card-tag">生產者</span>
            <h2 class="select-card-title">我是生產者</h2>
            <p class="select-card-desc">
              從原料採購到勞工透明度，找出供應鏈裡的改善空間，評估你的企業有多永續。
            </p>
            <span class="select-card-cta">
              開始自評
              <svg class="cta-arrow" width="14" height="14" viewBox="0 0 16 16" fill="none"
                   stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 8h10M9 4l4 4-4 4"/>
              </svg>
            </span>
          </a>

        </div>
      </div>
    </div>
  </section>

  <footer class="select-footer">
    <div class="container">
      <p>🌿 EcoPulse &nbsp;|&nbsp; 環境知識測驗</p>
    </div>
  </footer>

  <script src="../js/navbar.js"></script>
  <script>
    Navbar.init('quiz');
  </script>

</body>
</html>
