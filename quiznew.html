<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>環保測驗 — EcoPulse</title>
  <link rel="stylesheet" href="../css/base.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ============================================
       環保測驗 - 分頁式設計
       每頁 5 題，按主題分類
       包含完整響應式設計
       ============================================ */

    /* ===== 基礎樣式 ===== */
    #introPanel {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-2xl);
      align-items: center;
    }

    .intro-badges {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-sm);
      margin: var(--sp-lg) 0;
    }

    .category-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--clr-border);
      background: var(--clr-surface);
      font-size: 0.83rem;
      font-weight: 500;
    }

    .tier-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-md);
    }

    .tier-item {
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      padding: var(--sp-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--clr-border);
      background: var(--clr-surface);
    }

    .tier-icon {
      font-size: 1.5rem;
      width: 40px;
      text-align: center;
    }

    .tier-item strong {
      display: block;
      font-size: 0.9rem;
    }

    .tier-item span {
      font-size: 0.8rem;
      color: var(--clr-muted);
    }

    /* ===== 測驗頁面 ===== */
    #quizPanel {
      display: none;
      min-height: calc(100vh - var(--nav-h));
      padding: var(--sp-2xl) 0;
    }

    #quizPanel.active {
      display: block;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--sp-2xl);
      padding-bottom: var(--sp-lg);
      border-bottom: 2px solid var(--clr-border);
    }

    .quiz-header h2 {
      font-size: 1.5rem;
      color: var(--clr-dark);
      display: flex;
      align-items: center;
      gap: var(--sp-md);
    }

    .quiz-header-icon {
      font-size: 2rem;
    }

    .quiz-progress {
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
      font-size: 0.9rem;
      color: var(--clr-muted);
    }

    .progress-bar-container {
      width: 200px;
      height: 6px;
      background: var(--clr-border);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--clr-primary), var(--clr-primary-lt));
      transition: width 0.5s ease;
    }

    /* 題目卡片 */
    .questions-container {
      display: flex;
      flex-direction: column;
      gap: var(--sp-xl);
      margin-bottom: var(--sp-2xl);
    }

    .question-item {
      background: var(--clr-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--clr-border);
      padding: var(--sp-xl);
      transition: all var(--t-normal);
    }

    .question-item:hover {
      border-color: var(--clr-primary);
      box-shadow: 0 4px 12px rgba(58, 107, 58, 0.1);
    }

    .question-number {
      display: inline-block;
      width: 32px;
      height: 32px;
      background: var(--clr-primary);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: var(--sp-md);
    }

    .question-text {
      font-family: var(--ff-display);
      font-size: 1.1rem;
      color: var(--clr-dark);
      margin-bottom: var(--sp-lg);
      line-height: 1.5;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: var(--sp-md);
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      padding: var(--sp-md) var(--sp-lg);
      border-radius: var(--radius-md);
      border: 2px solid var(--clr-border);
      background: var(--clr-surface);
      text-align: left;
      cursor: pointer;
      transition: all var(--t-fast);
      font-family: var(--ff-body);
      font-size: 0.95rem;
      color: var(--clr-text);
      width: 100%;
    }

    .option-btn:hover {
      border-color: var(--clr-primary);
      background: #EAF3E6;
      transform: translateX(4px);
    }

    .option-btn.selected {
      border-color: var(--clr-primary);
      background: #EAF3E6;
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--clr-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: all var(--t-fast);
    }

    .option-btn.selected .option-letter,
    .option-btn:hover .option-letter {
      background: var(--clr-primary);
      color: #fff;
    }

    /* 導航按鈕 */
    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--sp-lg);
      margin-top: var(--sp-2xl);
    }

    .btn {
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--t-fast);
      font-family: var(--ff-body);
    }

    .btn-primary {
      background: var(--clr-primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--clr-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(58, 107, 58, 0.3);
    }

    .btn-secondary {
      background: var(--clr-border);
      color: var(--clr-text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--clr-muted);
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quiz-page-info {
      text-align: center;
      font-size: 0.9rem;
      color: var(--clr-muted);
    }

    /* ===== 結果頁面 ===== */
    #resultPanel {
      display: none;
      min-height: calc(100vh - var(--nav-h));
      padding: var(--sp-2xl) 0;
    }

    #resultPanel.active {
      display: block;
    }

    .result-header {
      text-align: center;
      padding: var(--sp-3xl) 0 var(--sp-2xl);
    }

    .tier-badge-large {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-sm);
      padding: var(--sp-xl) var(--sp-2xl);
      border-radius: var(--radius-xl);
      margin-bottom: var(--sp-lg);
      color: #fff;
    }

    .tier-badge-large .tier-emoji {
      font-size: 3.5rem;
    }

    .tier-badge-large .tier-name {
      font-family: var(--ff-display);
      font-size: 1.8rem;
    }

    .tier-badge-large .tier-score {
      font-size: 1rem;
      opacity: 0.85;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-xl);
      align-items: start;
      margin-top: var(--sp-2xl);
      margin-bottom: var(--sp-2xl);
    }

    .radar-wrap {
      background: var(--clr-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--clr-border);
      padding: var(--sp-xl);
    }

    .radar-wrap h3 {
      font-size: 1rem;
      margin-bottom: var(--sp-md);
      text-align: center;
    }

    .diagnosis-card {
      background: var(--clr-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--clr-border);
      padding: var(--sp-xl);
    }

    .diagnosis-card h3 {
      font-size: 1rem;
      margin-bottom: var(--sp-lg);
      display: flex;
      align-items: center;
      gap: var(--sp-sm);
    }

    .breakdown-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-md);
      margin-top: var(--sp-xl);
    }

    .breakdown-card {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-md);
      padding: var(--sp-lg);
      text-align: center;
    }

    .breakdown-score {
      font-family: var(--ff-display);
      font-size: 2rem;
      font-weight: 900;
      color: var(--clr-primary);
    }

    .breakdown-label {
      font-size: 0.8rem;
      color: var(--clr-muted);
      margin-top: 4px;
    }

    /* ===== 響應式設計 ===== */
    @media (max-width: 1024px) {
      .intro-grid {
        grid-template-columns: 1fr;
      }

      .intro-badges {
        flex-wrap: wrap;
      }

      .category-badge {
        font-size: 0.8rem;
        padding: 0.35rem 0.8rem;
      }

      .tier-list {
        gap: var(--sp-md);
      }

      .tier-item {
        padding: var(--sp-md);
      }

      .tier-icon {
        font-size: 1.3rem;
        width: 35px;
      }

      .tier-item strong {
        font-size: 0.85rem;
      }

      .tier-item span {
        font-size: 0.75rem;
      }

      .quiz-header h2 {
        font-size: 1.3rem;
      }

      .quiz-header-icon {
        font-size: 1.8rem;
      }

      .question-item {
        padding: var(--sp-lg);
      }

      .question-text {
        font-size: 1rem;
      }

      .option-btn {
        padding: var(--sp-md) var(--sp-lg);
        font-size: 0.9rem;
      }

      .result-grid {
        grid-template-columns: 1fr;
      }

      .breakdown-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 768px) {
      .intro-grid {
        grid-template-columns: 1fr;
      }

      .intro-badges {
        gap: var(--sp-sm);
      }

      .category-badge {
        font-size: 0.75rem;
        padding: 0.3rem 0.7rem;
      }

      .tier-list {
        gap: var(--sp-sm);
      }

      .tier-item {
        padding: var(--sp-md);
        gap: var(--sp-sm);
      }

      .tier-icon {
        font-size: 1.2rem;
        width: 32px;
      }

      .tier-item strong {
        font-size: 0.8rem;
      }

      .tier-item span {
        font-size: 0.7rem;
      }

      #quizPanel {
        padding: var(--sp-lg) 0;
      }

      .quiz-header {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--sp-md);
        margin-bottom: var(--sp-lg);
      }

      .quiz-header h2 {
        font-size: 1.2rem;
      }

      .quiz-header-icon {
        font-size: 1.6rem;
      }

      .quiz-progress {
        width: 100%;
        justify-content: space-between;
      }

      .progress-bar-container {
        width: 100%;
      }

      .question-item {
        padding: var(--sp-lg);
      }

      .question-text {
        font-size: 1rem;
        margin-bottom: var(--sp-md);
      }

      .option-btn {
        padding: var(--sp-md);
        font-size: 0.9rem;
      }

      .quiz-nav {
        gap: var(--sp-md);
      }

      .btn {
        padding: 0.7rem 1.2rem;
        font-size: 0.9rem;
      }

      .result-grid {
        grid-template-columns: 1fr;
        gap: var(--sp-lg);
        margin-bottom: var(--sp-lg);
      }

      .breakdown-grid {
        grid-template-columns: 1fr;
      }

      .tier-badge-large .tier-emoji {
        font-size: 3rem;
      }

      .tier-badge-large .tier-name {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .intro-badges {
        gap: var(--sp-xs);
      }

      .category-badge {
        font-size: 0.7rem;
        padding: 0.25rem 0.6rem;
      }

      .tier-list {
        gap: var(--sp-xs);
      }

      .tier-item {
        padding: var(--sp-sm);
        gap: var(--sp-xs);
      }

      .tier-icon {
        font-size: 1rem;
        width: 28px;
      }

      .tier-item strong {
        font-size: 0.75rem;
      }

      .tier-item span {
        font-size: 0.65rem;
      }

      #quizPanel {
        padding: var(--sp-md) 0;
      }

      .quiz-header {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--sp-sm);
        margin-bottom: var(--sp-lg);
        padding-bottom: var(--sp-md);
      }

      .quiz-header h2 {
        font-size: 1.1rem;
      }

      .quiz-header-icon {
        font-size: 1.4rem;
      }

      .quiz-progress {
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        gap: var(--sp-xs);
        font-size: 0.8rem;
      }

      .progress-bar-container {
        width: 100%;
        height: 4px;
      }

      .question-number {
        width: 28px;
        height: 28px;
        font-size: 0.8rem;
      }

      .question-item {
        padding: var(--sp-md);
        margin-bottom: var(--sp-md);
      }

      .question-text {
        font-size: 0.95rem;
        margin-bottom: var(--sp-md);
      }

      .options-list {
        gap: var(--sp-sm);
      }

      .option-btn {
        padding: var(--sp-sm) var(--sp-md);
        font-size: 0.85rem;
      }

      .option-letter {
        width: 24px;
        height: 24px;
        font-size: 0.75rem;
      }

      .quiz-nav {
        flex-direction: column;
        gap: var(--sp-sm);
      }

      .btn {
        width: 100%;
        padding: 0.6rem 1rem;
        font-size: 0.85rem;
      }

      .quiz-page-info {
        font-size: 0.8rem;
      }

      .result-grid {
        gap: var(--sp-lg);
      }

      .breakdown-grid {
        grid-template-columns: 1fr;
        gap: var(--sp-sm);
        margin-bottom: var(--sp-xl);
      }

      .breakdown-card {
        padding: var(--sp-md);
      }

      .breakdown-score {
        font-size: 1.5rem;
      }

      .breakdown-label {
        font-size: 0.7rem;
      }

      .tier-badge-large {
        padding: var(--sp-lg) var(--sp-md);
      }

      .tier-badge-large .tier-emoji {
        font-size: 2.5rem;
      }

      .tier-badge-large .tier-name {
        font-size: 1.2rem;
      }

      .tier-badge-large .tier-score {
        font-size: 0.9rem;
      }

      .radar-wrap,
      .diagnosis-card {
        padding: var(--sp-lg);
      }

      .radar-wrap h3,
      .diagnosis-card h3 {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <script src="../js/navbar.js"></script>

  <!-- ===== 介紹頁面 ===== -->
  <section class="section" id="introPanel">
    <div class="container">
      <div class="intro-grid">
        <div>
          <span class="badge badge-green" style="margin-bottom: var(--sp-md)">環保測驗</span>
          <h1>測測你的<br/>環保指數</h1>
          <p style="color: var(--clr-muted); margin: var(--sp-md) 0; font-size: 1.05rem">
            針對「責任消費與生產 SDG 12」設計的 20 題互動測驗。<br/>
            每個主題 5 題，完成後獲得你的環保雷達圖與深度個人化建議。
          </p>

          <div class="intro-badges">
            <span class="category-badge">🥗 綠色飲食 × 5</span>
            <span class="category-badge">🛍️ 明智購物 × 5</span>
            <span class="category-badge">♻️ 物品再生 × 5</span>
            <span class="category-badge">⚡ 節能減碳 × 5</span>
          </div>

          <button class="btn btn-primary" onclick="startQuiz()" style="font-size: 1rem; padding: 0.9rem 2rem">
            🚀 開始測驗
          </button>
        </div>

        <div class="tier-list">
          <div class="tier-item">
            <div class="tier-icon">🏆</div>
            <div>
              <strong>90+　金色永續守護者</strong>
              <span>引領永續生活的標竿</span>
            </div>
          </div>
          <div class="tier-item">
            <div class="tier-icon">🥈</div>
            <div>
              <strong>70–89　銀色綠色實踐家</strong>
              <span>持續踐行永續理念</span>
            </div>
          </div>
          <div class="tier-item">
            <div class="tier-icon">🥉</div>
            <div>
              <strong>50–69　銅色環保新手</strong>
              <span>開始認識永續生活</span>
            </div>
          </div>
          <div class="tier-item">
            <div class="tier-icon">🌱</div>
            <div>
              <strong>< 50　綠芽探索者</strong>
              <span>永續旅程的起點</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 測驗頁面 ===== -->
  <section class="section" id="quizPanel">
    <div class="container">
      <div class="quiz-header">
        <h2>
          <span class="quiz-header-icon" id="categoryIcon">🥗</span>
          <span id="categoryTitle">綠色飲食</span>
        </h2>
        <div class="quiz-progress">
          <span id="pageInfo">第 1 / 4 主題</span>
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressFill" style="width: 25%"></div>
          </div>
        </div>
      </div>

      <div class="questions-container" id="questionsContainer"></div>

      <div class="quiz-nav">
        <button class="btn btn-secondary" onclick="previousPage()" id="prevBtn" disabled>
          ← 上一頁
        </button>
        <div class="quiz-page-info">
          <span id="currentPage">第 1 / 4 頁</span>
        </div>
        <button class="btn btn-primary" onclick="nextPage()" id="nextBtn">
          下一頁 →
        </button>
      </div>
    </div>
  </section>

  <!-- ===== 結果頁面 ===== -->
  <section class="section" id="resultPanel">
    <div class="container">
      <div class="result-header">
        <div class="tier-badge-large" id="tierBadge">
          <div class="tier-emoji" id="tierEmoji">🏆</div>
          <div class="tier-name" id="tierName">金色永續守護者</div>
          <div class="tier-score" id="tierScore">90 分</div>
        </div>
      </div>

      <div class="result-grid">
        <div class="radar-wrap">
          <h3>環保指數雷達圖</h3>
          <canvas id="radarChart"></canvas>
        </div>

        <div class="diagnosis-card">
          <h3>🎯 個人化建議</h3>
          <div id="diagnosisContent"></div>
        </div>
      </div>

      <div class="breakdown-grid" id="breakdownGrid"></div>

      <div style="text-align: center; margin-top: var(--sp-2xl)">
        <button class="btn btn-primary" onclick="resetQuiz()" style="font-size: 1rem; padding: 0.9rem 2rem">
          🔄 重新測驗
        </button>
      </div>
    </div>
  </section>

  <script>
    // ============================================
    // 測驗資料結構
    // ============================================

    const QUIZ_DATA = {
      categories: [
        {
          id: 'diet',
          name: '綠色飲食',
          icon: '🥗',
          color: '#3a6b3a'
        },
        {
          id: 'shopping',
          name: '明智購物',
          icon: '🛍️',
          color: '#5a8a5a'
        },
        {
          id: 'reuse',
          name: '物品再生',
          icon: '♻️',
          color: '#7aa97a'
        },
        {
          id: 'energy',
          name: '節能減碳',
          icon: '⚡',
          color: '#9ac89a'
        }
      ],
      questions: [
        // 綠色飲食 (0-4)
        {
          category: 'diet',
          text: '您多久吃一次肉類食品？',
          options: [
            { text: '每天都吃', score: 0 },
            { text: '一週 3-4 次', score: 25 },
            { text: '一週 1-2 次', score: 50 },
            { text: '很少吃或不吃', score: 100 }
          ]
        },
        {
          category: 'diet',
          text: '您購買食材時是否考慮在地、當季產品？',
          options: [
            { text: '從不考慮', score: 0 },
            { text: '偶爾考慮', score: 33 },
            { text: '經常考慮', score: 66 },
            { text: '總是優先選擇', score: 100 }
          ]
        },
        {
          category: 'diet',
          text: '您家中有多少食物浪費？',
          options: [
            { text: '很多，經常丟棄', score: 0 },
            { text: '有一些浪費', score: 33 },
            { text: '很少浪費', score: 66 },
            { text: '幾乎沒有浪費', score: 100 }
          ]
        },
        {
          category: 'diet',

        },
        {

          options: [

            { text: '經常檢查', score: 66 },
            { text: '總是檢查', score: 100 }
          ]
        },
        {
          category: 'shopping',
          text: '您購物時是否會列清單以避免衝動購買？',
          options: [
            { text: '從不列清單', score: 0 },
            { text: '有時列清單', score: 33 },
            { text: '經常列清單', score: 66 },
            { text: '總是列清單', score: 100 }
          ]
        },
        // 物品再生 (10-14)
        {
          category: 'reuse',
          text: '您如何處理不再使用的物品？',
          options: [
            { text: '直接丟棄', score: 0 },
            { text: '有時捐贈或轉贈', score: 33 },
            { text: '經常捐贈或轉贈', score: 66 },
            { text: '優先尋找回收或轉贈機會', score: 100 }
          ]
        },
        {
          category: 'reuse',
          text: '您是否會修理損壞的物品而不是直接更換？',
          options: [

        },
        {

          options: [

          ]
        },
        {

          text: '您是否會購買由回收材料製成的產品？',
          options: [

        },
        {

          options: [

            { text: '比較了解', score: 66 },
            { text: '非常了解', score: 100 }
          ]
        },
        // 節能減碳 (15-19)
        {
          category: 'energy',
          text: '您使用什麼交通工具上班或外出？',
          options: [
            { text: '主要開私家車', score: 0 },
            { text: '經常開私家車', score: 25 },
            { text: '經常使用公共交通', score: 50 },
            { text: '主要使用公共交通或騎行', score: 100 }
          ]
        },
        {
          category: 'energy',
          text: '您家中使用可再生能源（如太陽能）的比例？',
          options: [
            { text: '完全不使用', score: 0 },
            { text: '少量使用', score: 33 },
            { text: '中等使用', score: 66 },
            { text: '主要使用可再生能源', score: 100 }
          ]
        },
        {
          category: 'energy',
          text: '您是否會主動節省家中的電力和水資源？',
          options: [
            { text: '從不節省', score: 0 },
            { text: '有時節省', score: 33 },
            { text: '經常節省', score: 66 },
            { text: '積極節省', score: 100 }
          ]
        },
        {
          category: 'energy',
          text: '您使用的電器設備中，有多少是能源效率高的？',
          options: [
            { text: '很少或沒有', score: 0 },
            { text: '部分設備', score: 33 },
            { text: '大多數設備', score: 66 },
            { text: '全部都是高效能設備', score: 100 }
          ]
        },
        {
          category: 'energy',
          text: '您對自己的碳足跡了解程度如何？',
          options: [
            { text: '完全不了解', score: 0 },
            { text: '略知一二', score: 33 },
            { text: '比較了解', score: 66 },
            { text: '非常了解並積極減少', score: 100 }
          ]
        }
      ]
    };

    // ============================================
    // 全局變數
    // ============================================

    let currentPage = 0; // 0-3 對應四個主題
    let userAnswers = {};
    let radarChart = null;

    // ============================================
    // 初始化
    // ============================================

    function startQuiz() {
      document.getElementById('introPanel').style.display = 'none';
      document.getElementById('quizPanel').classList.add('active');
      currentPage = 0;
      userAnswers = {};
      renderPage();
    }

    // ============================================
    // 渲染頁面
    // ============================================

    function renderPage() {
      const category = QUIZ_DATA.categories[currentPage];
      const categoryQuestions = QUIZ_DATA.questions.filter(q => q.category === category.id);

      // 更新頁頭
      document.getElementById('categoryIcon').textContent = category.icon;
      document.getElementById('categoryTitle').textContent = category.name;
      document.getElementById('pageInfo').textContent = `第 ${currentPage + 1} / 4 主題`;
      document.getElementById('currentPage').textContent = `第 ${currentPage + 1} / 4 頁`;
      document.getElementById('progressFill').style.width = `${(currentPage + 1) * 25}%`;

      // 設定背景顏色
      const tierBadge = document.querySelector('.tier-badge-large');
      if (tierBadge) {
        tierBadge.style.background = category.color;
      }

      // 渲染題目
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      categoryQuestions.forEach((question, index) => {
        const questionId = QUIZ_DATA.questions.indexOf(question);
        const savedAnswer = userAnswers[questionId];

        const questionHTML = `
          <div class="question-item">
            <div class="question-number">${index + 1}</div>
            <div class="question-text">${question.text}</div>
            <div class="options-list">
              ${question.options.map((option, optionIndex) => `
                <button class="option-btn ${savedAnswer === optionIndex ? 'selected' : ''}" 
                        onclick="selectAnswer(${questionId}, ${optionIndex})">
                  <span class="option-letter">${String.fromCharCode(65 + optionIndex)}</span>
                  <span>${option.text}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
        container.innerHTML += questionHTML;
      });

      // 更新按鈕狀態
      document.getElementById('prevBtn').disabled = currentPage === 0;
      document.getElementById('nextBtn').textContent = currentPage === 3 ? '查看結果 →' : '下一頁 →';
    }

    // ============================================
    // 選擇答案
    // ============================================

    function selectAnswer(questionId, optionIndex) {
      userAnswers[questionId] = optionIndex;

      // 更新 UI - 只移除同一題的 selected，其他題目保留
      const questionElement = event.target.closest('.question-item');
      questionElement.querySelectorAll('.option-btn').forEach(btn => {
        btn.classList.remove('selected');
      });
      event.target.closest('.option-btn').classList.add('selected');
    }

    // ============================================
    // 翻頁
    // ============================================

    function previousPage() {
      if (currentPage > 0) {
        currentPage--;
        renderPage();
        window.scrollTo(0, 0);
      }
    }

    function nextPage() {
      // 檢查當前頁面是否所有題目都已作答
      const category = QUIZ_DATA.categories[currentPage];
      const categoryQuestions = QUIZ_DATA.questions.filter(q => q.category === category.id);
      const allAnswered = categoryQuestions.every((q, idx) => {
        const questionId = QUIZ_DATA.questions.indexOf(q);
        return userAnswers[questionId] !== undefined;
      });

      if (!allAnswered) {
        alert('⚠️ 請完成這一頁的所有題目後再繼續');
        return;
      }

      if (currentPage < 3) {
        currentPage++;
        renderPage();
        window.scrollTo(0, 0);
      } else {
        showResults();
      }
    }

    // ============================================
    // 計算結果
    // ============================================

    function showResults() {
      // 計算總分
      let totalScore = 0;
      let categoryScores = {
        diet: 0,
        shopping: 0,
        reuse: 0,
        energy: 0
      };
      let categoryCounts = {
        diet: 0,
        shopping: 0,
        reuse: 0,
        energy: 0
      };

      for (let questionId in userAnswers) {
        const question = QUIZ_DATA.questions[questionId];
        const optionIndex = userAnswers[questionId];
        const score = question.options[optionIndex].score;

        totalScore += score;
        categoryScores[question.category] += score;
        categoryCounts[question.category]++;
      }

      // 計算總分（保持 0-100 分制）
      totalScore = Math.round(totalScore / 20);

      // 計算平均分
      for (let cat in categoryScores) {
        categoryScores[cat] = Math.round(categoryScores[cat] / categoryCounts[cat]);
      }

      // 決定等級
      let tier, emoji, tierName;
      if (totalScore >= 90) {
        tier = 'gold';
        emoji = '🏆';
        tierName = '金色永續守護者';
      } else if (totalScore >= 70) {
        tier = 'silver';
        emoji = '🥈';
        tierName = '銀色綠色實踐家';
      } else if (totalScore >= 50) {
        tier = 'bronze';
        emoji = '🥉';
        tierName = '銅色環保新手';
      } else {
        tier = 'sprout';
        emoji = '🌱';
        tierName = '綠芽探索者';
      }

      // 更新結果頁面
      document.getElementById('quizPanel').classList.remove('active');
      document.getElementById('resultPanel').classList.add('active');

      document.getElementById('tierEmoji').textContent = emoji;
      document.getElementById('tierName').textContent = tierName;
      document.getElementById('tierScore').textContent = `${totalScore} /100 分`;

      // 設定背景顏色
      const tierBadge = document.getElementById('tierBadge');
      const tierColors = {
        gold: '#FFD700',
        silver: '#C0C0C0',
        bronze: '#CD7F32',
        sprout: '#3a6b3a'
      };
      tierBadge.style.background = tierColors[tier];

      // 渲染分解圖表
      renderBreakdownGrid(categoryScores);

      // 渲染雷達圖
      renderRadarChart(categoryScores);

      // 渲染診斷內容
      renderDiagnosis(totalScore, categoryScores);
    }

    function renderBreakdownGrid(categoryScores) {
      const categories = QUIZ_DATA.categories;
      const grid = document.getElementById('breakdownGrid');
      grid.innerHTML = '';

      categories.forEach(cat => {
        const score = categoryScores[cat.id];
        const html = `
          <div class="breakdown-card">
            <div style="font-size: 1.5rem; margin-bottom: var(--sp-sm);">${cat.icon}</div>
            <div style="font-size: 0.9rem; font-weight: 600; margin-bottom: var(--sp-sm);">${cat.name}</div>
            <div class="breakdown-score">${score}</div>
            <div class="breakdown-label">/ 100</div>
          </div>
        `;
        grid.innerHTML += html;
      });
    }

    function renderRadarChart(categoryScores) {
      const ctx = document.getElementById('radarChart').getContext('2d');

      if (radarChart) {
        radarChart.destroy();
      }

      radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['綠色飲食', '明智購物', '物品再生', '節能減碳'],
          datasets: [{
            label: '您的環保指數',
            data: [
              categoryScores.diet,
              categoryScores.shopping,
              categoryScores.reuse,
              categoryScores.energy
            ],
            borderColor: '#3a6b3a',
            backgroundColor: 'rgba(58, 107, 58, 0.2)',
            borderWidth: 2,
            pointRadius: 5,
            pointBackgroundColor: '#3a6b3a'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          scales: {
            r: {
              beginAtZero: true,
              max: 100,
              ticks: {
                stepSize: 20
              }
            }
          }
        }
      });
    }

    function renderDiagnosis(totalScore, categoryScores) {
      const content = document.getElementById('diagnosisContent');

      let diagnosis = '';

      if (totalScore >= 90) {
        diagnosis = `
          <div class="alert-item tip">
            <strong>🌟 您是永續生活的模範</strong>
            <p>您的環保意識和行動力都非常出色，已經在日常生活中實踐了責任消費與生產的理念。</p>
          </div>
          <div class="alert-item tip">
            <strong>💡 下一步建議</strong>
            <p>考慮成為環保大使，分享您的經驗，影響身邊的人一起加入永續生活的行列。</p>
          </div>
        `;
      } else if (totalScore >= 70) {
        diagnosis = `
          <div class="alert-item tip">
            <strong>✨ 您是綠色生活的實踐者</strong>
            <p>您已經在多個方面實踐了永續消費，保持這樣的努力非常棒！</p>
          </div>
          <div class="alert-item warn">
            <strong>📈 改進空間</strong>
            <p>可以在得分較低的領域加強，例如 ${getLowestCategory(categoryScores)}。</p>
          </div>
        `;
      } else if (totalScore >= 50) {
        diagnosis = `
          <div class="alert-item tip">
            <strong>🌱 您已開始環保之旅</strong>
            <p>您對永續生活有基本認識，現在是深化行動的好時機。</p>
          </div>
          <div class="alert-item warn">
            <strong>🎯 重點改進</strong>
            <p>建議優先改進 ${getLowestCategory(categoryScores)} 領域，從小行動開始。</p>
          </div>
        `;
      } else {
        diagnosis = `
          <div class="alert-item warn">
            <strong>🔔 永續生活的開始</strong>
            <p>您正在開始了解永續消費的重要性，這是很好的起點！</p>
          </div>
          <div class="alert-item warn">
            <strong>🚀 行動計畫</strong>
            <p>從 ${getLowestCategory(categoryScores)} 開始，選擇一個簡單的改變，逐步建立永續習慣。</p>
          </div>
        `;
      }

      content.innerHTML = diagnosis;
    }

    function getLowestCategory(categoryScores) {
      const categories = QUIZ_DATA.categories;
      let lowest = categories[0];
      let lowestScore = categoryScores[lowest.id];

      for (let cat of categories) {
        if (categoryScores[cat.id] < lowestScore) {
          lowest = cat;
          lowestScore = categoryScores[cat.id];
        }
      }

      return lowest.name;
    }

    // ============================================
    // 重新測驗
    // ============================================

    function resetQuiz() {
      document.getElementById('resultPanel').classList.remove('active');
      document.getElementById('introPanel').style.display = 'flex';
      currentPage = 0;
      userAnswers = {};

      if (radarChart) {
        radarChart.destroy();
        radarChart = null;
      }

      window.scrollTo(0, 0);
    }
  </script>
